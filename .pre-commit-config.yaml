# TxnVigil v2 — pre-commit hooks (spec §17.5, NFR-06; P0-T03).
# Local hooks only, no pinned remote hook revisions (CP-0a D7): tools come from the uv dev group
# (`make sync`), except gitleaks, which must be installed separately on your machine.
# Install: `uv run pre-commit install` (pre-commit itself is not a project dependency).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright (strict on core/)
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # gitleaks must be installed locally (https://github.com/gitleaks/gitleaks); CI runs it regardless.
      # Newer gitleaks releases also offer `gitleaks git --pre-commit --staged`; `protect` still works.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: no-crlf
        name: no CRLF line endings
        entry: '\r$'
        language: pygrep
        types: [text]
        exclude: '\.(ps1|bat)$'
      - id: no-large-data-files
        name: no data/ files or >1 MB .parquet/.csv
        entry: uv run python scripts/check_large_files.py
        language: system
