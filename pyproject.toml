# TxnVigil v2 — Python project (P0-T03; spec §7.4, §12.2, §17.1, §22; ADR-0005).
# Lower bounds only (CP-0a D7, CP-0 K2): the CI `lock` job resolves uv.lock, which is the version
# source of truth once committed (RD-1 §0).

[project]
name = "txnvigil"
version = "0.0.0"
description = "Real-time UPI transaction-risk and mule-detection platform (v2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = ["legacy", "notebooks", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "DTZ", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["core", "services", "simulator", "adapters", "ml", "scripts"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff >=0.16 formats Markdown code blocks; docs snippets are illustrative

# ---------------------------------------------------------------------------- pyright
[tool.pyright]
pythonVersion = "3.12"
include = ["core", "services", "simulator", "adapters", "ml", "tests", "scripts"]
exclude = ["legacy", "web", "notebooks", "**/__pycache__", ".venv"]
strict = ["core"]
typeCheckingMode = "standard"

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast pure unit tests (spec §18.2)",
    "property: hypothesis property-based tests (spec §18.3)",
    "integration: tests needing real dependencies in containers",
    "ml: model training / evaluation tests",
    "e2e: end-to-end tests",
    "perf: performance tests",
    "slow: slow tests",
]

# ---------------------------------------------------------------------------- coverage
# CI gate: fail below 80% on core/; 90% is a goal (CP-0a D-D R4, NFR-08).
[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
